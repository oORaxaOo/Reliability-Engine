[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-engine"
version = "0.1.0"
description = "Deterministic safeguards and privacy-conscious monitoring for small-LLM agent runtimes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "oORaxaOo" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
